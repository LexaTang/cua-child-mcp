name: Windows build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Build portable package
        shell: pwsh
        run: ./package.ps1
      - name: Check CLI
        shell: pwsh
        run: |
          ./dist/cua-child.exe self-test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./dist/cua-child.exe --help
      - uses: actions/upload-artifact@v4
        with:
          name: cua-child-mcp-win-x64
          path: dist/
