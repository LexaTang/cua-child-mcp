name: Windows build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Build portable package
        shell: pwsh
        run: ./package.ps1
      - name: Check CLI
        shell: pwsh
        run: |
          ./dist/cua-child.exe self-test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./dist/cua-child.exe --help
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Archive and checksum
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: ./scripts/archive-release.ps1 -Tag $env:RELEASE_TAG
      - uses: actions/upload-artifact@v4
        with:
          name: cua-child-mcp-win-x64
          path: release/*
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cua-child-mcp-win-x64
          path: release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          # Upload assets to a draft before publishing a complete release.
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json; then
            if [ "$(jq -r .isDraft release-state.json)" != true ]; then
              echo "Release already published; leaving its assets unchanged."
              exit 0
            fi
          else
            args=(--verify-tag --draft --generate-notes --title "$RELEASE_TAG")
            if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
            gh release create "$RELEASE_TAG" "${args[@]}"
          fi
          gh release upload "$RELEASE_TAG" release/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false
